name: "Bug report"
description: Report a problem with the libretro port of Dolphin
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you running on?
      options:
        - Android
        - Linux
        - iOS
        - iPadOS
        - macOS
        - tvOS
        - webOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      description: Which graphics backend are you using?
      options:
        - Vulkan
        - OpenGL/OpenGLES
        - D3D11
        - D3D12
        - Other
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game exhibiting the issue
      description: Name of the game where the issue occurs
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: Provide a clear and detailed description of the problem
    validations:
      required: true

  - type: textarea
    id: log_output
    attributes:
      label: Log output (note - logs are required for support!)
      description: |
        Paste relevant log output here (use code blocks if possible). See here how to generate a log file: [libretro.com](https://docs.libretro.com/guides/generating-retroarch-logs/)

        For large logs: [Pastebin](https://pastebin.com/) / [Hastebin](https://www.toptal.com/developers/hastebin) / [Gist](https://gist.github.com/). Do not upload zip files!
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Note:** Please first check that the standalone Dolphin emulator does not have this issue.  
        If the issue also occurs in standalone Dolphin, please report it at [Dolphin's bug tracker](https://bugs.dolphin-emu.org/projects/emulator/issues) instead.
